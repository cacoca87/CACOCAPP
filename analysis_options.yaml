# Reglas de análisis de Cacocapp.
#
# OJO: hasta ahora este archivo contenía por error una copia vieja del
# `pubspec.yaml` (con `name:`, `dependencies:`, etc.). Como no tenía la
# línea `include:` de abajo, los lints de Flutter NUNCA se ejecutaron y
# `flutter analyze` daba siempre "No issues found!" aunque hubiera cosas
# para corregir -- o sea, el chequeo estaba apagado sin que se notara.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # El paquete se llama "CACOCAPP" (en mayúsculas) desde el primer
    # commit y hay imports `package:CACOCAPP/...` en los tests.
    # Renombrarlo sería puramente cosmético y obligaría a tocar archivos
    # que hoy funcionan, así que se desactiva la regla en vez de forzar
    # el cambio.
    package_names: false

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - windows/**
